name: build

# 三端构建验证 + 未签名产物。正式发布（含签名与 release notes）仍在本地进行：
# - macOS DMG 为 ad-hoc 签名（build.sh 内置），可直接分发
# - iOS 产物为未签名 IPA，安装需用自己的 Apple ID 重签（见 release 说明）
# - Android 为 debug 签名 APK，可直接侧载
# 平台 tag 产出各自的安装包：vX.Y.Z 为 macOS，vX.Y.Z-ios 为 iOS，
# vX.Y.Z-android 为 Android。master push、PR 与手动触发构建三端。
on:
  push:
    branches: ['master']
    tags: ['v*']
  pull_request:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  apple:
    # The arm64 macos-15 pool can time out before acquiring a runner.
    # Build both app architectures on the standard Intel pool with an explicit Xcode.
    if: ${{ !(startsWith(github.ref, 'refs/tags/') && endsWith(github.ref, '-android')) }}
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Check generated skin tokens
        run: python3 design/gen_skins.py --check

      - name: Install Apple build prerequisites
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Run Apple offline regressions
        env:
          TMPDIR: ${{ runner.temp }}/apple-fixtures-tmp
        run: |
          mkdir -p "$TMPDIR"
          # Shared Intel runners stall the main loop up to ~0.7 s on their own;
          # 0.9 s still sits below the 1.2 s synthetic read, so a real block fails.
          python3 HabiticaPomodoro/fixtures/run.py --work "$TMPDIR" --max-main-gap 0.9

      - name: Build macOS app + DMG (universal, ad-hoc signed)
        if: ${{ !startsWith(github.ref, 'refs/tags/') || !endsWith(github.ref, '-ios') }}
        env:
          HABITICA_BUILD_TEMP: ${{ runner.temp }}
          HABITICA_BUILD_OUTPUT: ${{ runner.temp }}/mac-app
        run: bash HabiticaPomodoro/build.sh

      - name: Build iOS device app (unsigned) + IPA
        if: ${{ !startsWith(github.ref, 'refs/tags/') || endsWith(github.ref, '-ios') }}
        run: |
          cd HabiticaPomodoro
          xcodegen generate
          xcodebuild -project HabiticaPomodoroMobile.xcodeproj \
            -scheme HabiticaPomodoroMobile \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" -jobs 2 -configuration Release \
            build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM=''
          APP="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/HabiticaPomodoro.app"
          APPEX="$APP/PlugIns/HabiticaPomodoroWidgets.appex"
          test -d "$APPEX"  # Live Activity + home-screen widget extension ships inside the app
          # Ad-hoc signatures only carry the App Group entitlement: AltStore/SideStore read it
          # from the IPA to register a group for free accounts. Re-signing replaces them.
          codesign --force --sign - --entitlements iOSWidgets/HabiticaPomodoroWidgets.entitlements "$APPEX"
          codesign --force --sign - --entitlements iOS/HabiticaPomodoro.entitlements "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qr "$RUNNER_TEMP/HabiticaPomodoro-iOS-unsigned.ipa" Payload

      - name: Build iOS Simulator app (compile check)
        if: ${{ !startsWith(github.ref, 'refs/tags/') || endsWith(github.ref, '-ios') }}
        run: |
          cd HabiticaPomodoro
          xcodebuild -project HabiticaPomodoroMobile.xcodeproj \
            -scheme HabiticaPomodoroMobile \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/sim-dd" -jobs 2 -configuration Debug \
            build CODE_SIGNING_ALLOWED=NO

      - name: Collect artifacts + checksums
        run: |
          output="$GITHUB_WORKSPACE/dist"
          mkdir -p "$output"
          if [[ "$GITHUB_REF" != refs/tags/* || "$GITHUB_REF" != *-ios ]]; then
            ditto -c -k --keepParent "$RUNNER_TEMP/mac-app/HabiticaPomodoro.app" \
              "$output/HabiticaPomodoro-macOS-universal.app.zip"
            cp "$GITHUB_WORKSPACE/HabiticaPomodoro/HabiticaPomodoro-Installer.dmg" "$output/"
          fi
          if [[ "$GITHUB_REF" != refs/tags/* || "$GITHUB_REF" == *-ios ]]; then
            cp "$RUNNER_TEMP/HabiticaPomodoro-iOS-unsigned.ipa" "$output/"
          fi
          cd "$output"
          shopt -s nullglob
          shasum -a 256 *.zip *.dmg *.ipa > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: apple-artifacts
          path: dist/
          if-no-files-found: error

  android:
    if: ${{ !startsWith(github.ref, 'refs/tags/') || endsWith(github.ref, '-android') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          # Pin the SDK pieces the Gradle build expects instead of the action default.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Check generated skin tokens
        run: python3 design/gen_skins.py --check

      - name: Run Android offline regressions
        env:
          POMO_FIXTURES_WORK: ${{ runner.temp }}/android-fixtures
          POMO_FIXTURES_TOOLCHAIN: ${{ runner.temp }}/android-fixtures-toolchain
          TMPDIR: ${{ runner.temp }}/android-fixtures-tmp
        run: |
          mkdir -p "$TMPDIR"
          python3 HabiticaPomodoroAndroid/fixtures/run.py

      - name: Build debug APK
        run: |
          cd HabiticaPomodoroAndroid
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain

      - name: Collect artifacts + checksums
        run: |
          mkdir -p dist
          cp HabiticaPomodoroAndroid/app/build/outputs/apk/debug/app-debug.apk \
             dist/HabiticaPomodoro-Android-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/HabiticaPomodoro-Android-debug.apk | grep '^package'
          cd dist
          sha256sum HabiticaPomodoro-Android-debug.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: android-artifacts
          path: dist/
          if-no-files-found: error
