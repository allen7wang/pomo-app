name: HabiticaPomodoroMobile
options:
  bundleIdPrefix: com.hermes
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "3.1.0"
    CURRENT_PROJECT_VERSION: 8
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  HabiticaPomodoroMobile:
    type: application
    platform: iOS
    sources:
      # iOS 专属入口与界面
      - path: iOS
      # 跨平台共享核心
      - path: HabiticaPomodoro/PlatformCompat.swift
      - path: HabiticaPomodoro/AppStyle.swift
      - path: HabiticaPomodoro/SkinTokens.swift
      - path: HabiticaPomodoro/SkinComponents.swift
      - path: HabiticaPomodoro/AppTabState.swift
      - path: HabiticaPomodoro/PomodoroEngine.swift
      - path: HabiticaPomodoro/SettingsManager.swift
      - path: HabiticaPomodoro/PomodoroFileStore.swift
      - path: HabiticaPomodoro/BlockProgressManager.swift
      - path: HabiticaPomodoro/TopThreeManager.swift
      - path: HabiticaPomodoro/HistogramManager.swift
      - path: HabiticaPomodoro/AudioManager.swift
      - path: HabiticaPomodoro/PomodoroModels.swift
      - path: HabiticaPomodoro/HabiticaRequestBudget.swift
      - path: HabiticaPomodoro/HabiticaAPI.swift
      - path: HabiticaPomodoro/TopThreeView.swift
      - path: HabiticaPomodoro/HabiticaTabsView.swift
      - path: HabiticaPomodoro/BlockNotificationManager.swift
      - path: HabiticaPomodoro/BlockRewardManager.swift
      - path: HabiticaPomodoro/PlantJournal.swift
      - path: HabiticaPomodoro/TopThreeMerge.swift
      - path: HabiticaPomodoro/FocusReview.swift
      - path: HabiticaPomodoro/TaskFocusViews.swift
      # 音频资源（folder 引用，保持 audio/ 子目录结构）
      - path: HabiticaPomodoro/audio
        type: folder
        buildPhase: resources
    dependencies:
      # 锁屏实时活动 + 主屏「今日任务」小组件，嵌入 PlugIns/
      - target: HabiticaPomodoroWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hermes.habitica-pomodoro.ios
        PRODUCT_NAME: HabiticaPomodoro
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        # 只含 App Group（与小组件共享今日任务快照）；改 bundle ID 时两个 entitlements 一起改
        CODE_SIGN_ENTITLEMENTS: iOS/HabiticaPomodoro.entitlements
        # 真机签名：免费个人团队 + 自动签名；模拟器构建可用 CODE_SIGNING_ALLOWED=NO 跳过
        DEVELOPMENT_TEAM: Q7N96QQT8M
        CODE_SIGN_STYLE: Automatic

  # WidgetKit 扩展：实时活动（锁屏/灵动岛）+ 主屏今日任务。必须是 Xcode app-extension
  # target——手工包装的可执行文件在 WidgetKit 启动时崩溃（见 TodayTasksWidget 说明）。
  HabiticaPomodoroWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: iOSWidgets
      # 与主 App 共用：ActivityAttributes、视图与 App Group 快照模型
      - path: iOS/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hermes.habitica-pomodoro.ios.widgets
        PRODUCT_NAME: HabiticaPomodoroWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: iOSWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Habitica Pomodoro
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_ENTITLEMENTS: iOSWidgets/HabiticaPomodoroWidgets.entitlements
        DEVELOPMENT_TEAM: Q7N96QQT8M
        CODE_SIGN_STYLE: Automatic
